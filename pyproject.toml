[project]
name = "improvement-lab"
version = "0.1.0"
requires-python = ">=3.12"
description = "Personal Code Lab"
authors = [
    { name = "Felipe Martin Rodriguez", email = "felipemrz01@gmail.com" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "transformers",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "torchaudio==2.5.1+cu121",
    "python-multipart",
    "jinja2",
    "pydantic",
    "httpx",
    "typer",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
]

[tool.ruff]
src = ["app", "tests"]
line-length = 100
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  ".mypy_cache",
  ".pytest_cache",
  "dist",
  "build",
]

[tool.ruff.lint]
extend-select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle
    "F",  # Pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "D",  # pydocstyle
]
ignore = ["D104", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
